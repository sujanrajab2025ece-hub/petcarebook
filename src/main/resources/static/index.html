<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PetCareBook</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body><aside><a class="brand" href="#dashboard"><span>✦</span> PetCareBook</a><p class="eyebrow">CARE CENTER</p><nav><button class="nav active" data-view="dashboard">⌂ Overview</button><button class="nav" data-view="pets">🐾 Pets</button><button class="nav" data-view="owners">♙ Owners</button><button class="nav" data-view="vaccine-types">✚ Vaccine types</button><button class="nav" data-view="vaccination-records">▣ Vaccination log</button></nav><div class="side-note"><b>Stay ahead of care.</b><br>Track every booster in one calm place.</div></aside>
<main><header><div><p class="eyebrow" id="kicker">CARE AT A GLANCE</p><h1 id="title">Good health begins with a plan.</h1></div><button class="primary" id="add-button">+ Add pet</button></header><section id="dashboard" class="view active"><div class="stats"><article><span>🐾</span><p>Pets</p><strong id="pet-count">—</strong></article><article><span>✚</span><p>Vaccine records</p><strong id="record-count">—</strong></article><article><span>◷</span><p>Due in 7 days</p><strong id="due-count">—</strong></article><article><span>!</span><p>Overdue</p><strong id="overdue-count">—</strong></article></div><div class="panel"><div class="panel-heading"><div><p class="eyebrow">UPCOMING CARE</p><h2>Vaccines coming due</h2></div><button class="quiet" id="open-log">View log →</button></div><div id="due-list" class="timeline"></div></div></section><section id="module" class="view"><div class="toolbar"><div class="search"><input id="search-input" placeholder="Search by name"><button id="search-button">Search</button><button id="clear-button" class="quiet">Clear</button></div><button class="primary" id="module-add">+ Add</button></div><div class="panel table-wrap"><table><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div></section></main>
<div class="modal-backdrop" id="modal"><form id="record-form" class="modal"><div class="modal-title"><div><p class="eyebrow" id="form-kicker">NEW RECORD</p><h2 id="form-title">Add pet</h2></div><button type="button" id="close-modal" class="icon">×</button></div><div id="form-fields" class="form-grid"></div><p id="form-error" class="form-error"></p><div class="form-actions"><button type="button" class="quiet" id="cancel-modal">Cancel</button><button class="primary" type="submit">Save record</button></div></form></div><div id="toast"></div><script src="js/script.js"></script></body></html>
